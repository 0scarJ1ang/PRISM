[[sections.themes]]
title = "Expanding the Skill Boundary"
description = "A policy is trained once, but new objectives and constraints keep arriving. How can we widen where it works, both by shaping what it learns and by steering it at deployment?"

[[sections.themes]]
title = "Understanding the Skill Boundary"
description = "A skill's name says little about where it succeeds. How can we predict where a learned policy works, and state it in a form that planners and agents can use to invoke and compose it correctly?"

